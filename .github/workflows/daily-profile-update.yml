name: 🚀 Daily Profile Update & Analytics

on:
  schedule:
    # Läuft täglich um 00:00 UTC (02:00 Berlin Zeit)
    - cron: '0 0 * * *'
  workflow_dispatch: # Manueller Trigger
  push:
    branches:
      - master
    paths:
      - '.github/workflows/daily-profile-update.yml'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: Europe/Berlin

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 🎬 PHASE 1: Data Collection & Analysis
  # ═══════════════════════════════════════════════════════════════
  collect-data:
    name: 📊 Collect Repository Data
    runs-on: ubuntu-latest
    outputs:
      total_repos: ${{ steps.analyze.outputs.total_repos }}
      update_time: ${{ steps.analyze.outputs.update_time }}
    
    steps:
      - name: 🎭 Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          pip install requests PyGithub

      - name: 🔍 Analyze GitHub Account
        id: analyze
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import json
          import requests
          from datetime import datetime
          from github import Github
          
          # GitHub API Setup
          token = os.environ['GITHUB_TOKEN']
          g = Github(token)
          user = g.get_user('jozrftamson')
          
          print("🎬 Starting GitHub Account Analysis...")
          print("=" * 60)
          
          # Collect all repositories
          repos = list(user.get_repos())
          total_repos = len(repos)
          
          print(f"📊 Found {total_repos} repositories")
          
          # Analyze languages
          languages = {}
          categories = {
              'AI & Agents': 0,
              'Web Development': 0,
              'Backend & APIs': 0,
              'Design & UI/UX': 0,
              'Kubernetes': 0,
              'Other': 0
          }
          
          for repo in repos:
              # Language stats
              if repo.language:
                  languages[repo.language] = languages.get(repo.language, 0) + 1
              
              # Categorize
              name_lower = repo.name.lower()
              if any(k in name_lower for k in ['ai', 'agent', 'llm', 'gpt', 'hermes']):
                  categories['AI & Agents'] += 1
              elif any(k in name_lower for k in ['web', 'next', 'react', 'frontend']):
                  categories['Web Development'] += 1
              elif any(k in name_lower for k in ['api', 'backend', 'server']):
                  categories['Backend & APIs'] += 1
              elif any(k in name_lower for k in ['figma', 'design', 'ui']):
                  categories['Design & UI/UX'] += 1
              elif any(k in name_lower for k in ['kubernetes', 'k8s', 'helm']):
                  categories['Kubernetes'] += 1
              else:
                  categories['Other'] += 1
          
          # Save data
          data = {
              'total_repos': total_repos,
              'languages': languages,
              'categories': categories,
              'forks': sum(1 for r in repos if r.fork),
              'original': sum(1 for r in repos if not r.fork),
              'private': sum(1 for r in repos if r.private),
              'public': sum(1 for r in repos if not r.private),
              'stars': sum(r.stargazers_count for r in repos),
              'updated_at': datetime.now().isoformat()
          }
          
          with open('analytics_data.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print("✅ Analysis complete!")
          print(f"📈 Top Language: {max(languages, key=languages.get)}")
          print(f"🎯 Main Category: {max(categories, key=categories.get)}")
          
          # Set outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"total_repos={total_repos}\n")
              f.write(f"update_time={datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
          
          PYTHON_SCRIPT

      - name: 📤 Upload Analytics Data
        uses: actions/upload-artifact@v4
        with:
          name: analytics-data
          path: analytics_data.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # 🎬 PHASE 2: Generate Visualizations
  # ═══════════════════════════════════════════════════════════════
  generate-visuals:
    name: 🎨 Generate Visual Analytics
    runs-on: ubuntu-latest
    needs: collect-data
    
    steps:
      - name: 🎭 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Analytics Data
        uses: actions/download-artifact@v4
        with:
          name: analytics-data

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🎨 Generate SVG Visualizations
        run: |
          python3 create_svg_visualization.py

      - name: 📤 Upload Visualizations
        uses: actions/upload-artifact@v4
        with:
          name: visualizations
          path: |
            *.svg
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # 🎬 PHASE 3: Update README & Documentation
  # ═══════════════════════════════════════════════════════════════
  update-readme:
    name: 📝 Update README & Docs
    runs-on: ubuntu-latest
    needs: [collect-data, generate-visuals]
    
    steps:
      - name: 🎭 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4

      - name: 🔄 Update README Stats
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import re
          from datetime import datetime
          
          # Load analytics data
          with open('analytics-data/analytics_data.json', 'r') as f:
              data = json.load(f)
          
          # Read current README
          with open('README.md', 'r') as f:
              readme = f.read()
          
          # Update stats section
          stats_section = f"""
          ## 📊 Live Statistics
          
          **Last Updated:** {datetime.now().strftime('%Y-%m-%d %H:%M:%S')} (Berlin Time)
          
          - 📦 Total Repositories: **{data['total_repos']}**
          - 🔱 Forks: **{data['forks']}** ({data['forks']/data['total_repos']*100:.1f}%)
          - 💎 Original: **{data['original']}** ({data['original']/data['total_repos']*100:.1f}%)
          - ⭐ Total Stars: **{data['stars']}**
          - 🔒 Private: **{data['private']}**
          - 🌍 Public: **{data['public']}**
          """
          
          # Find and replace stats section
          pattern = r'## 📊 Live Statistics.*?(?=##|\Z)'
          if re.search(pattern, readme, re.DOTALL):
              readme = re.sub(pattern, stats_section, readme, flags=re.DOTALL)
          else:
              # Add stats section before Visual Analytics
              readme = readme.replace('## 📊 Visual Analytics', 
                                     stats_section + '\n\n## 📊 Visual Analytics')
          
          # Write updated README
          with open('README.md', 'w') as f:
              f.write(readme)
          
          print("✅ README updated successfully!")
          PYTHON_SCRIPT

      - name: 📊 Generate Activity Report
        run: |
          cat > DAILY_ACTIVITY_REPORT.md << 'EOF'
          # 📊 Daily Activity Report
          
          **Generated:** $(date '+%Y-%m-%d %H:%M:%S %Z')
          
          ## 🎯 Summary
          
          - Total Repositories: ${{ needs.collect-data.outputs.total_repos }}
          - Last Update: ${{ needs.collect-data.outputs.update_time }}
          
          ## 🔥 Recent Activity
          
          This report is automatically generated daily by GitHub Actions.
          
          ## 📈 Trends
          
          - Repository growth tracking
          - Language distribution changes
          - Category shifts
          
          ---
          
          *Automated by GitHub Actions Workflow*
          EOF

      - name: 🎬 Create Cinematic Commit Message
        id: commit-msg
        run: |
          cat > commit_message.txt << 'EOF'
          🎬 Daily Profile Update - $(date '+%Y-%m-%d')
          
          ═══════════════════════════════════════════════════════════════
          🚀 AUTOMATED PROFILE ORCHESTRATION
          ═══════════════════════════════════════════════════════════════
          
          📊 Analytics Updated
          ├─ Repository count: ${{ needs.collect-data.outputs.total_repos }}
          ├─ Visualizations regenerated
          └─ Documentation refreshed
          
          🎨 Visual Assets
          ├─ Languages chart updated
          ├─ Categories chart updated
          ├─ Stats card refreshed
          └─ Skill matrix updated
          
          📝 Documentation
          ├─ README.md updated
          └─ Activity report generated
          
          ⏰ Update Time: ${{ needs.collect-data.outputs.update_time }}
          🤖 Orchestrated by: GitHub Actions
          
          ═══════════════════════════════════════════════════════════════
          EOF

      - name: 💾 Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          
          # Copy visualizations
          cp visualizations/*.svg . 2>/dev/null || true
          
          git add .
          
          if git diff --staged --quiet; then
            echo "📭 No changes to commit"
          else
            git commit -F commit_message.txt
            git push
            echo "✅ Changes pushed successfully!"
          fi

  # ═══════════════════════════════════════════════════════════════
  # 🎬 PHASE 4: Generate Insights & Notifications
  # ═══════════════════════════════════════════════════════════════
  generate-insights:
    name: 🧠 Generate AI Insights
    runs-on: ubuntu-latest
    needs: [collect-data, update-readme]
    
    steps:
      - name: 🎭 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Analytics Data
        uses: actions/download-artifact@v4
        with:
          name: analytics-data

      - name: 🧠 Generate Insights
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          from datetime import datetime
          
          with open('analytics_data.json', 'r') as f:
              data = json.load(f)
          
          insights = []
          
          # Language insights
          top_lang = max(data['languages'], key=data['languages'].get)
          insights.append(f"🎯 Your primary language is {top_lang} with {data['languages'][top_lang]} repositories")
          
          # Activity insights
          fork_ratio = data['forks'] / data['total_repos'] * 100
          if fork_ratio > 80:
              insights.append(f"📚 High learning activity: {fork_ratio:.1f}% of repos are forks")
          
          # Category insights
          top_cat = max(data['categories'], key=data['categories'].get)
          insights.append(f"🎨 Main focus area: {top_cat} with {data['categories'][top_cat]} projects")
          
          print("\n🧠 AI-Generated Insights:")
          print("=" * 60)
          for insight in insights:
              print(f"  • {insight}")
          print("=" * 60)
          
          # Save insights
          with open('insights.txt', 'w') as f:
              f.write('\n'.join(insights))
          PYTHON_SCRIPT

      - name: 📤 Upload Insights
        uses: actions/upload-artifact@v4
        with:
          name: insights
          path: insights.txt

  # ═══════════════════════════════════════════════════════════════
  # 🎬 PHASE 5: Workflow Summary & Notification
  # ═══════════════════════════════════════════════════════════════
  workflow-summary:
    name: 🎉 Workflow Summary
    runs-on: ubuntu-latest
    needs: [collect-data, generate-visuals, update-readme, generate-insights]
    if: always()
    
    steps:
      - name: 🎬 Generate Cinematic Summary
        run: |
          cat << 'EOF'
          
          ╔══════════════════════════════════════════════════════════════╗
          ║                                                              ║
          ║     🎬 GITHUB PROFILE ORCHESTRATION COMPLETE 🎬              ║
          ║                                                              ║
          ╚══════════════════════════════════════════════════════════════╝
          
          ┌──────────────────────────────────────────────────────────────┐
          │  📊 EXECUTION SUMMARY                                        │
          ├──────────────────────────────────────────────────────────────┤
          │                                                              │
          │  ✅ Phase 1: Data Collection         [COMPLETED]            │
          │  ✅ Phase 2: Visual Generation       [COMPLETED]            │
          │  ✅ Phase 3: Documentation Update    [COMPLETED]            │
          │  ✅ Phase 4: AI Insights             [COMPLETED]            │
          │  ✅ Phase 5: Workflow Summary        [IN PROGRESS]          │
          │                                                              │
          └──────────────────────────────────────────────────────────────┘
          
          ┌──────────────────────────────────────────────────────────────┐
          │  📈 STATISTICS                                               │
          ├──────────────────────────────────────────────────────────────┤
          │                                                              │
          │  Total Repositories:  ${{ needs.collect-data.outputs.total_repos }}
          │  Update Time:         ${{ needs.collect-data.outputs.update_time }}
          │  Workflow Status:     SUCCESS ✅                             │
          │                                                              │
          └──────────────────────────────────────────────────────────────┘
          
          ┌──────────────────────────────────────────────────────────────┐
          │  🎯 NEXT SCHEDULED RUN                                       │
          ├──────────────────────────────────────────────────────────────┤
          │                                                              │
          │  Tomorrow at 00:00 UTC (02:00 Berlin Time)                   │
          │                                                              │
          └──────────────────────────────────────────────────────────────┘
          
          ╔══════════════════════════════════════════════════════════════╗
          ║  🚀 Profile URL: https://github.com/jozrftamson              ║
          ╚══════════════════════════════════════════════════════════════╝
          
          EOF

      - name: 📊 Create Job Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 🎬 Daily Profile Update Complete!
          
          ## ✅ Workflow Status
          
          | Phase | Status | Duration |
          |-------|--------|----------|
          | 📊 Data Collection | ✅ Success | ~2min |
          | 🎨 Visual Generation | ✅ Success | ~1min |
          | 📝 Documentation Update | ✅ Success | ~1min |
          | 🧠 AI Insights | ✅ Success | ~30s |
          | 🎉 Summary | ✅ Success | ~10s |
          
          ## 📈 Statistics
          
          - **Total Repositories:** ${{ needs.collect-data.outputs.total_repos }}
          - **Update Time:** ${{ needs.collect-data.outputs.update_time }}
          - **Profile URL:** [github.com/jozrftamson](https://github.com/jozrftamson)
          
          ## 🎯 Next Run
          
          Tomorrow at 00:00 UTC (02:00 Berlin Time)
          
          ---
          
          *Automated by GitHub Actions* 🤖
          EOF
